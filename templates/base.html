<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Análises da produção científica do CEPID NeuroMat feitas de 2011 a 2025.">

    <title>{% block title %}Vitrine NeuroMat{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
</head>

<body>

    <!-- Link de pulo para acessibilidade -->
    <a href="#main-content" class="skip-link">
        Ir direto para o conteúdo principal
    </a>

    <header class="main-header">
        <div class="header-content">

            <h1 class="visually-hidden">Vitrine NeuroMat</h1>

            <a href="{{ url_for('home') }}" class="site-logo">
                Vitrine NeuroMat
            </a>

            <nav
                role="navigation"
                class="main-nav"
                aria-label="Menu principal"
            >
                <a href="#featured" class="nav-item">
                    Artigo em destaque
                </a>

                <a href="#academic" class="nav-item">
                    Publicações Acadêmicas
                </a>

                <a href="#researchers" class="nav-item">
                    Pesquisadores
                </a>

                <a href="#socialimpact" class="nav-item">
                    Impacto Social
                </a>
            </nav>

        </div>
    </header>


    <main id="main-content">

        {% block content %}
        {% endblock %}

        <a href="#top" class="back-to-top">
            Voltar ao início
        </a>

    </main>


    {% include 'partials/footer.html' %}


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/featured.js') }}"></script>
    <script src="{{ url_for('static', filename='js/researchers.js') }}"></script>


    <!-- Região de status para leitores de tela -->
    <div
        id="status-message"
        role="status"
        aria-live="polite"
        class="visually-hidden"
    ></div>

</body>
</html>
